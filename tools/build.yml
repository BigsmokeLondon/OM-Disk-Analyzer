# Builds OM Disk Analyzer on GitHub's own Windows and Mac computers.
#
#   * Run it by hand: Actions > "Build OM Disk Analyzer" > Run workflow (files appear under "Artifacts").
#   * Publish a release: push a tag such as v2.0.0 (git tag v2.0.0 && git push origin v2.0.0).
#     That runs the tests, builds everything and creates the GitHub Release with all the files.
name: Build OM Disk Analyzer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo test
      - run: ./tools/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo test
      - run: bash tools/build_mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -l release
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "OM Disk Analyzer ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
