# Builds every OM Disk Analyzer installer on GitHub's own Windows and Mac computers.
# Put the app folder in a GitHub repository, open Actions > "Build OM Disk Analyzer" > Run workflow,
# and download the finished files from the run's "Artifacts" section.
name: Build OM Disk Analyzer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel   # Intel Mac
            arch: x86_64
          - runner: macos-15         # Apple Silicon Mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash tools/build_mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python tools/build_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: |
            dist/*.exe
            dist/*.zip
